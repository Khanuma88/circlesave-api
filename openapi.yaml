openapi: 3.0.3
info:
  title: CircleSave API
  description: Digital ROSCA (Құты) Platform - Automated rotating savings circles
  version: 1.0.0

servers:
  - url: http://localhost:3001/v1
    description: Local Development

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              phone: "+77001234567"
              email: "user@example.com"
              password: "SecurePass123!"
              firstName: "Aisha"
              lastName: "Ivanova"
      responses:
        "201":
          description: User registered, verification email sent
        "409":
          description: Phone or email already registered
        "422":
          description: Validation error

  /auth/verify-email:
    post:
      summary: Verify email with code
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
            example:
              email: "user@example.com"
              code: "123456"
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: Invalid or expired code

  /auth/login:
    post:
      summary: Login with phone and password
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                password:
                  type: string
            example:
              phone: "+77001234567"
              password: "SecurePass123!"
      responses:
        "200":
          description: Login successful, returns tokens
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified

  /auth/forgot-password:
    post:
      summary: Request password reset code
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
            example:
              email: "user@example.com"
      responses:
        "200":
          description: Reset code sent if email exists

  /auth/reset-password:
    post:
      summary: Reset password with code
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
            example:
              email: "user@example.com"
              code: "123456"
              newPassword: "NewPass123!"
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Invalid or expired code

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New tokens issued
        "401":
          description: Invalid refresh token

  /auth/logout:
    post:
      summary: Logout
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out successfully

  /circles:
    get:
      summary: List circles with cursor pagination
      tags: [Circles]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [FORMING, ACTIVE, RUNNING, COMPLETED]
      responses:
        "200":
          description: Paginated list of circles

    post:
      summary: Create new circle (ORGANIZER only)
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
            example:
              name: "My Savings Circle"
              contributionAmount: 10000
              memberCount: 5
              startDate: "2026-06-01T00:00:00.000Z"
              cycleLengthDays: 30
      responses:
        "201":
          description: Circle created
        "400":
          description: Invalid start date
        "403":
          description: Insufficient role

  /circles/{circleId}:
    get:
      summary: Get circle details
      tags: [Circles]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Circle details with members
        "403":
          description: Not a member
        "404":
          description: Circle not found

  /circles/{circleId}/join:
    post:
      summary: Join a circle
      tags: [Circles]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Joined successfully
        "403":
          description: Circle not forming or trust score too low
        "409":
          description: Already a member or circle full

  /circles/{circleId}/payments/schedule:
    post:
      summary: Create payment schedule (ORGANIZER only)
      tags: [Payments]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Payment schedule created
        "403":
          description: Insufficient role

  /circles/{circleId}/payments:
    get:
      summary: Get my payment schedule
      tags: [Payments]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of payments

  /circles/{circleId}/payments/pay:
    post:
      summary: Make a payment
      tags: [Payments]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleNumber, amount]
              properties:
                cycleNumber:
                  type: integer
                amount:
                  type: number
            example:
              cycleNumber: 1
              amount: 10000
      responses:
        "200":
          description: Payment processed
        "404":
          description: Payment not found
        "409":
          description: Already paid

  /circles/{circleId}/payments/payout:
    post:
      summary: Calculate and process payout (ORGANIZER only)
      tags: [Payments]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleNumber]
              properties:
                cycleNumber:
                  type: integer
            example:
              cycleNumber: 1
      responses:
        "200":
          description: Payout processed
        "403":
          description: Insufficient role

  /circles/{circleId}/ledger:
    get:
      summary: Get immutable ledger entries
      tags: [Ledger]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ledger entries

  /circles/{circleId}/balance:
    get:
      summary: Get circle balance
      tags: [Ledger]
      parameters:
        - name: circleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balance details

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [phone, email, password]
      properties:
        phone:
          type: string
          example: "+77001234567"
        email:
          type: string
          example: "user@example.com"
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    CreateCircleRequest:
      type: object
      required: [name, contributionAmount, memberCount, startDate]
      properties:
        name:
          type: string
        contributionAmount:
          type: number
          minimum: 5000
          maximum: 500000
        memberCount:
          type: integer
          minimum: 3
          maximum: 20
        startDate:
          type: string
          format: date-time
        cycleLengthDays:
          type: integer
          default: 30